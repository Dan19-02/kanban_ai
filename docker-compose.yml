# Local PostgreSQL for backend development.
#   docker compose up -d        # start the database
#   docker compose down         # stop it (data is preserved in the volume)
#   docker compose down -v      # stop and wipe all data
#
# The credentials below match DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
